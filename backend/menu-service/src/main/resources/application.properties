spring.application.name=menu-service
server.port=8081

# MySQL Configuration (XAMPP default: root / empty password)
spring.datasource.url=jdbc:mysql://localhost:3306/menu_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
